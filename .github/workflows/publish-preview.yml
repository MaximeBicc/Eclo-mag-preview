name: Publish Eclo Mag Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v6

      - name: Download compiled Godot preview
        run: |
          curl -L --fail --retry 3 "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-ac38-8210-b40d-cf8350299e5b/raw?se=2026-09-29T11%3A58%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=4ea22b06-8129-5025-81e0-f877ba94570e&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A58%3A05Z&ske=2026-09-30T06%3A58%3A05Z&sks=b&skv=2026-02-06&sig=CypvE7zJcq4CJBsKMvmG/r1t59l69rCjM7hb%2BLCrwhU%3D" -o preview.zip
          mkdir -p extracted site
          unzip -q preview.zip -d extracted
          cp -R extracted/Web/. site/
          touch site/.nojekyll

      - name: Publish compiled site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
