name: Publish Android Test Update

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-android-test.yml"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-test-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v6

      - name: Download Android test artifact
        run: |
          curl -L --fail --retry 3 "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2ba4-8210-b811-7ebcd5d85140/raw?se=2026-09-30T07%3A32%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=8145f279-4102-5406-ab92-2342e67d22de&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T04%3A53%3A26Z&ske=2026-10-01T04%3A53%3A26Z&sks=b&skv=2026-02-06&sig=V9nv/CbAPp3uafehPnxc8X9g5dvEQa/QZu4%2BujL1ke4%3D" -o android-test.zip
          mkdir -p extracted site
          unzip -q android-test.zip -d extracted
          APK_PATH="$(find extracted -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" site/EcloMag-test.apk

      - name: Write update manifest
        run: |
          SHA256="$(sha256sum site/EcloMag-test.apk | awk '{print $1}')"
          cat > site/latest.json <<EOF
          {
            "version_code": 1059,
            "version_name": "0.1.59-test",
            "apk_url": "https://raw.githubusercontent.com/MaximeBicc/Eclo-mag-preview/android-test/EcloMag-test.apk",
            "sha256": "$SHA256"
          }
          EOF

      - name: Publish Android update channel
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: android-test
          force_orphan: true
